name: fintech-fun

services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/fintechfun
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p fintechfun 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    volumes:
      - neo4j-data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - qdrant-data:/qdrant/storage

  api-server:
    image: fintech-fun/api-server:local
    pull_policy: never
    ports:
      - "8000:8080"
    environment:
      PORT: "8080"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: fintechfun
      QDRANT_URL: http://qdrant:6333
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
  qdrant-data:
